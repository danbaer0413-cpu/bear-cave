name: Refresh live data
on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours; speed this up on election nights
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: danbaer0413-cpu/election-needle
          path: needle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - run: python tools/refresh.py needle
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898783+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet -- data/needle_now.csv data/needle_history.csv data/needle_control.csv data/house_seats.csv data/senate_seats.csv && { echo "no new results"; exit 0; }
          git commit -m "Refresh live data"
          git push
